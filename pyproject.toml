[project]
name = "open-agents-eth-global"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "gitingest>=0.3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["judges", "tests"]
markers = [
    "integration: tests that hit a live external service (e.g. Ollama)",
]
